
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISCO DOOM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090014;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 35px 15px 20px;
}

h1 {
    margin: 0;
    font-size: clamp(42px, 8vw, 75px);
    color: #ff36e4;
    text-shadow: 0 0 15px #ff36e4, 0 0 35px #8b35ff;
    letter-spacing: 5px;
}

p {
    color: #cbb9e8;
    margin: 12px 0 25px;
}

button {
    background: #ff36e4;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    margin: 6px;
    box-shadow: 0 0 18px #ff36e4;
}

button:hover {
    background: #c927ff;
}

.game-container {
    width: min(1100px, 95%);
    margin: 15px auto 40px;
    border: 2px solid #a32cff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px #8b35ff;
    background: black;
}

iframe {
    display: block;
    width: 100%;
    height: 700px;
    border: none;
}

@media (max-width: 600px) {
    iframe {
        height: 550px;
    }
}
</style>
</head>

<body>

<header>
    <h1>DISCO DOOM</h1>
    <p>Dodge. Survive. Don't get hit.</p>
    <button onclick="document.getElementById('game').scrollIntoView({behavior:'smooth'})">
        PLAY NOW
    </button>
    <button onclick="document.getElementById('game-frame').requestFullscreen()">
        FULLSCREEN
    </button>
</header>

<div class="game-container" id="game">
<iframe id="game-frame" src="game.html" title="DISCO DOOM Game" allowfullscreen></iframe>    
</div>

</body>
</html>
